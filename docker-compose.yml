# Unified Next.js + PostgreSQL deployment: docker compose up --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: app_db
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - docline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/app_db
      DOCLINE_SESSION_SECRET: ${DOCLINE_SESSION_SECRET:?set DOCLINE_SESSION_SECRET in .env}
      DOCLINE_AUTH_MODE: ${DOCLINE_AUTH_MODE:-sso}
      SSO_PROXY_SECRET: ${SSO_PROXY_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-}
      PIPELINE_API_TOKEN: ${PIPELINE_API_TOKEN:-}
      ENFORCE_SEPARATION_OF_DUTIES: ${ENFORCE_SEPARATION_OF_DUTIES:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-300000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DOCLINE_DEMO_MODE: ${DOCLINE_DEMO_MODE:-}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  docline-pgdata:
